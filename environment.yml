name: contract-harness
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.*
  - pip

  # === 核心依赖（与 pyproject.toml [dependencies] 一致）===
  - click>=8.1
  - tqdm>=4.65
  - pydantic>=2.0
  - httpx>=0.27
  - jinja2>=3.0
  - python-docx>=1.0
  - pypdf>=4.0
  - fastapi>=0.110
  - uvicorn>=0.27
  - python-multipart>=0.0.9
  - python-dotenv>=1.0

  # === 开发依赖 ===
  - pytest>=8.0
  - pytest-cov>=5.0
  - ruff>=0.4

  # === pip-only 依赖 ===
  - pip:
    - openai>=1.0
    - chromadb>=0.5.0
    - loguru>=0.7
    - rank-bm25>=0.2
    - langchain>=0.3
    - json-repair>=0.2
    - pyyaml>=6.0
    - pyright>=1.1

    # === 可选依赖（按需取消注释）===
    # 本地嵌入/重排序：pip install -e ".[local]"
    # - sentence-transformers>=3.0
    # Docling 文档解析：pip install -e ".[docling]"
    # - docling>=2.0
