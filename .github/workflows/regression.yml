name: 回归测试

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "harness/**"

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: 运行回归测试
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY 未配置，使用 Mock LLM 运行"
          fi
          harness regression run examples/contracts/ --version "ci-$(date +'%Y%m%d')-${GITHUB_SHA::7}"
      - name: 上传回归报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ github.sha }}
          path: ~/.harness/reports/
          retention-days: 30
