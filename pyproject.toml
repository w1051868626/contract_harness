[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-harness"
version = "0.1.0"
description = "可回放、可评测、可回归的合同审查 Agent 系统"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.0",
    "jinja2>=3.0",
    "tabulate>=0.9",
    "python-docx>=1.0",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "chromadb>=0.5.0",
]

[project.scripts]
harness = "harness.cli.main:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"harness/rag/seed_laws.py" = ["E501"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
]
local = [
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
