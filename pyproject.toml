[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-harness"
version = "0.1.0"
description = "可回放、可评测、可回归的合同审查 Agent 系统"
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.1",
    "tqdm>=4.65",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "jinja2>=3.0",
    "python-docx>=1.0",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "chromadb>=0.5.0",
    "loguru>=0.7",
    "rank-bm25>=0.2",
    "langchain>=0.3",
    "json-repair>=0.2",
    "pyyaml>=6.0",
]

[project.scripts]
harness = "harness.cli.main:cli"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"harness/rag/seed_laws.py" = ["E501"]
"tests/*" = ["E501"]
"debug/*" = ["E501"]
"debug_runner.py" = ["E402"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
]
local = [
    "sentence-transformers>=3.0",
]
docling = [
    "docling>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
