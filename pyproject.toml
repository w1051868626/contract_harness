[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-harness"
version = "0.1.0"
description = "可回放、可评测、可回归的合同审查 Agent 系统"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.0",
    "jinja2>=3.0",
    "tabulate>=0.9",
    "python-docx>=1.0",
    "pypdf>=4.0",
]

[project.scripts]
harness = "harness.cli.main:cli"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
